<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد نویسندگان</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background-color: #f9fafb; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-center">داشبورد مدیریتی نویسندگان</h1>
    <div id="dashboard" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    const sheetUrls = [
      "1uC_8mw5P5tjbpA-zc4tdWu_SKtQL_0kctmVtkga4VCE",
      "1gePRA5aIKoaBrJw7WasXpR_UMbcAiwFJ1xMY3nzd9Z4",
      "1EmjiKTGtxhfR5mwNtZ57HgG-F6BJNJtx2frW6-MmfSE",
      "1B17gfSatYpj2GIEd9L8nEEl5plOINbd2u_FJMiapwr4",
      "1AwgDlft1oMMnhYNFcvtzq1nWbZu-UrVbexK8OCNe3Ew",
      "13om9Q3ZLHhJqu0rkHMuscjvxdmGCtKZqSnzaC2GJ4c0",
      "1xbfswAE2s5RJjv11B_MZecAfFZup55hqbM5sj5106Dc",
      "11QADioqb7NEZtUsrkmTVG6bL2mey9rE-UwUntDauefI",
      "1gGhBdjbId2Br7x1ZDqLHJrij6H1Rz2M8NSCXSsaEC6o",
      "1nzKZux-wRc7dAbTtJslhzKlajan_KMM2-Qxb72mKqIY",
      "15BTzCCFnypHbppNiaPz2EBK59fv39kt_oEIb-yHhiM4",
      "18drcD83x6wu5ITKq1tgmS2oywRpZ9vPQJgmhBQtVMjc",
      "1WJWK7onLOhPry6FD2cIyBtctG9aPsXAOSM66N0dGiKU"
    ];

    async function loadSheetsData() {
      const container = document.getElementById("dashboard");

      for (const id of sheetUrls) {
        const queryUrl = `https://opensheet.elk.sh/${id}/writer`;
        try {
          const res = await fetch(queryUrl);
          const data = await res.json();

          const card = document.createElement("div");
          card.className = "bg-white rounded-2xl shadow-md p-4 hover:shadow-xl transition";

          const totalWords = data.reduce((sum, row) => sum + (parseInt(row["کلمات نوشته شده"]) || 0), 0);
          const startDates = data.map(row => row["تاریخ شروع نگارش"]).filter(Boolean);

          card.innerHTML = `
            <h2 class="text-xl font-semibold mb-2">شیت: ${id.slice(0, 8)}...</h2>
            <p>تعداد مطالب: <strong>${data.length}</strong></p>
            <p>مجموع کلمات نوشته‌شده: <strong>${totalWords.toLocaleString()}</strong></p>
            <p>اولین تاریخ نگارش: ${startDates.sort()[0] || '-'}</p>
            <a href="https://docs.google.com/spreadsheets/d/${id}" target="_blank" class="inline-block mt-4 text-blue-600 hover:underline">مشاهده شیت</a>
          `;

          container.appendChild(card);
        } catch (error) {
          console.error("Error loading sheet", id, error);
        }
      }
    }

    loadSheetsData();
  </script>
</body>
</html>
